clean_rooms:
  name: Clean rooms
  description: Start a room clean using Narwal's local clean/start_clean command.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    rooms:
      name: Rooms
      description: Narwal room IDs to clean, in order, or "all" for all current map rooms.
      required: true
      selector:
        object:
    mode:
      name: Mode
      default: vacuum_and_mop
      selector:
        select:
          options:
            - vacuum
            - mop
            - vacuum_then_mop
            - vacuum_and_mop
    suction:
      name: Suction
      default: standard
      selector:
        select:
          options:
            - ai
            - quiet
            - standard
            - strong
            - super_powerful
            - ultra_powerful
    water:
      name: Water
      default: normal
      selector:
        select:
          options:
            - dry
            - normal
            - wet
    mop_strength:
      name: Mop strength
      default: normal
      selector:
        select:
          options:
            - normal
            - high
    passes:
      name: Passes
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    route:
      name: Route
      selector:
        select:
          options:
            - standard
            - meticulous

set_pending_profiles:
  name: Set pending profiles
  description: >-
    Atomically set idle-only global and room profiles plus the final room
    selection. This service never sends robot commands.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    global_profile:
      name: Global profile
      required: true
      selector:
        object:
    room_profiles:
      name: Room profiles
      description: Profiles keyed by current-map Narwal room selection entities.
      required: true
      selector:
        object:
    selected_room_entities:
      name: Final selected rooms
      required: true
      selector:
        entity:
          integration: narwal
          domain: switch
          multiple: true
