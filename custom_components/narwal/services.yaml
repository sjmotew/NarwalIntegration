clean_rooms:
  name: Clean rooms
  description: Start a room clean using Narwal's local clean/start_clean command.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    rooms:
      name: Rooms
      description: Narwal room IDs to clean, in order, or "all" for all current map rooms.
      required: true
      selector:
        object:
    mode:
      name: Mode
      default: vacuum_and_mop
      selector:
        select:
          translation_key: clean_mode
          options:
            - vacuum
            - mop
            - vacuum_then_mop
            - vacuum_and_mop
    suction:
      name: Suction
      default: standard
      selector:
        select:
          translation_key: suction
          options:
            - ai
            - quiet
            - standard
            - strong
            - super_powerful
            - ultra_powerful
    water:
      name: Water
      default: normal
      selector:
        select:
          translation_key: water
          options:
            - dry
            - normal
            - wet
    mop_strength:
      name: Mop strength
      default: normal
      selector:
        select:
          translation_key: mop_strength
          options:
            - normal
            - high
    passes:
      name: Passes
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    route:
      name: Route
      selector:
        select:
          translation_key: route
          options:
            - standard
            - meticulous

set_pending_profiles:
  name: Set pending profiles
  description: >-
    Atomically set idle-only global and room profiles plus the final room
    selection. This service never sends robot commands.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    global_profile:
      name: Global profile
      required: true
      selector:
        object:
    room_profiles:
      name: Room profiles
      description: >-
        Profiles keyed by current-map room ID or exact unique room name. Omitted
        rooms retain their profiles. Use clean_rooms keys and integer passes.
      required: true
      selector:
        object:
    selected_rooms:
      name: Final selected rooms
      description: >-
        List of current-map room IDs or exact unique names. Omit to preserve the
        selection; use [] to clear it for whole-floor cleaning. Room order is unchanged.
      selector:
        object:
