clean_rooms:
  name: Clean rooms
  description: Start a room clean using Narwal's local clean/start_clean command.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    rooms:
      name: Rooms
      description: Narwal room IDs to clean, in order, or "all" for all current map rooms.
      required: true
      selector:
        object:
    mode:
      name: Mode
      default: vacuum_and_mop
      selector:
        select:
          translation_key: clean_mode
          options:
            - vacuum
            - mop
            - vacuum_then_mop
            - vacuum_and_mop
    suction:
      name: Suction
      default: standard
      selector:
        select:
          translation_key: suction
          options:
            - ai
            - quiet
            - standard
            - strong
            - super_powerful
            - ultra_powerful
    water:
      name: Water
      default: normal
      selector:
        select:
          translation_key: water
          options:
            - dry
            - normal
            - wet
    mop_strength:
      name: Mop strength
      default: normal
      selector:
        select:
          translation_key: mop_strength
          options:
            - normal
            - high
    passes:
      name: Passes
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    route:
      name: Route
      selector:
        select:
          translation_key: route
          options:
            - standard
            - meticulous
get_topic_response:
  name: Get topic response
  description: Send one raw topic to the robot and return its reply as hex, without interpreting it. Use vacuum.send_command to change a setting.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    topic:
      name: Topic
      description: Short topic without product key and device ID, lowercase segments separated by "/", e.g. region/get.
      required: true
      example: region/get
      selector:
        text:
    payload_hex:
      name: Payload (hex)
      description: Protobuf request body as a hex string. Most reads take none.
      example: "0a00"
      selector:
        text:
    timeout:
      name: Timeout
      description: Seconds to wait for the reply.
      default: 5
      selector:
        number:
          min: 1
          max: 10
          step: 0.5
          unit_of_measurement: s
          mode: box
